name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.package }} · py${{ matrix.python }}
    runs-on: ubuntu-latest
    # The embedding-sweep and project-placement tests need a real PostgreSQL with pgvector
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: memento_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Install package + dev deps
        working-directory: ${{ matrix.package }}
        # The exact versions in uv.lock, the same the Docker image runs. Resolving pyproject.toml here took whatever
        # was newest: on 11-23 redis-py 8.2.0 (production runs 6.4.0) broke fakeredis and failed 30-odd tests.
        run: |
          uv export --frozen --extra dev --no-emit-project --no-header --format requirements-txt -o /tmp/ci-requirements.txt
          uv pip install --system --require-hashes -r /tmp/ci-requirements.txt
          uv pip install --system --no-deps -e .
          uv pip install --system ruff==0.17.6

      - name: AST syntax check
        working-directory: ${{ matrix.package }}
        run: python -m compileall -q .

      # The Docker image installs server/requirements.lock: it must match uv.lock, and uv.lock must match pyproject.toml
      - name: Dependency lock is current
        working-directory: server
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt | diff - requirements.lock

      # pyflakes + bugbear + comparison/bare-except + async blocking I/O rules
      - name: Lint
        run: |
          ruff check --isolated --select F,B,E711,E712,E722 --ignore B008,B904,B905,B007,B005 server/server server/tests scripts embedding
          ruff check --isolated --select ASYNC230,ASYNC240,ASYNC251 server/server

      - name: pytest
        working-directory: ${{ matrix.package }}
        env:
          MEMENTO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/memento_test
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest -v -W error::RuntimeWarning
          else
            echo "No tests in ${{ matrix.package }}/tests — skipping."
          fi

  # The TypeScript server taking over from server/ route by route (docs/ts-server-migration.md): its own tests
  # against Postgres, then the contract check: both servers on one database and Redis, the same requests,
  # responses compared field by field. Also fails when the Python migrations changed the schema and
  # packages/server/db/schema.sql (what the TS side is checked against) wasn't refreshed.
  ts-server:
    name: ts · server (tests + contract with python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: memento
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace @memento/server --include-workspace-root

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Python server deps
        working-directory: server
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o /tmp/ts-ci-requirements.txt
          uv pip install --system --require-hashes -r /tmp/ts-ci-requirements.txt
          uv pip install --system --no-deps -e .

      - name: Schema from the Python migrations matches packages/server/db/schema.sql
        env:
          MEMENTO_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/memento
          MEMENTO_DEBUG: "1"
        run: |
          (cd server && python -m server.db.migrations)
          docker run --rm --network host -e PGPASSWORD=test pgvector/pgvector:pg16 \
            pg_dump -h localhost -U postgres -d memento --schema-only --no-owner --no-privileges > /tmp/schema.sql
          # pg_dump 16.10+ adds \restrict lines with a random key each run
          diff <(grep -v '^\\' /tmp/schema.sql) <(grep -v '^\\' packages/server/db/schema.sql) \
            || { echo "::error::表结构变了：在跑过迁移的库上重新 pg_dump 到 packages/server/db/schema.sql，并 npm run db:pull -w @memento/server"; exit 1; }

      - name: typecheck, tests & bundle
        env:
          MEMENTO_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/memento_ts_test
        run: |
          docker run --rm --network host -e PGPASSWORD=test pgvector/pgvector:pg16 psql -h localhost -U postgres -c "CREATE DATABASE memento_ts_test"
          npm run typecheck -w @memento/server
          npm run test -w @memento/server
          npm run build -w @memento/server

      - name: contract · python and ts answer the same
        env:
          MEMENTO_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/memento
          MEMENTO_REDIS_URL: redis://localhost:6379/0
          MEMENTO_SECRET_KEY: ci-contract-secret-0123456789
          MEMENTO_COLLECTOR_TOKEN: ci-contract-collector
          MEMENTO_S3_ACCESS_KEY: ci
          MEMENTO_S3_SECRET_KEY: ci-secret
          MEMENTO_SKIP_DDL_MIGRATIONS: "1"
          MEMENTO_HOST: 127.0.0.1
        run: |
          (cd server && python -m uvicorn server.main:app --host 127.0.0.1 --port 18001 > /tmp/py.log 2>&1 &)
          MEMENTO_PORT=18002 node packages/server/dist/main.mjs > /tmp/ts.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:18001/health >/dev/null && curl -sf localhost:18002/health >/dev/null && break; sleep 1; done
          curl -sf -X POST localhost:18001/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"contract@example.com","password":"Contract-pass-123","name":"对照"}' >/dev/null
          node packages/server/scripts/contract.mts --py http://127.0.0.1:18001 --ts http://127.0.0.1:18002 \
            --email contract@example.com --password Contract-pass-123 \
            || { echo "--- python"; tail -50 /tmp/py.log; echo "--- ts"; tail -50 /tmp/ts.log; exit 1; }

  ts-client:
    name: ts · core + daemon + mcp + desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspace at the repo root: packages/*, apps/*, web
      - run: npm ci
        env:
          # Typechecking the desktop app doesn't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: core · typecheck & test
        run: |
          npm run typecheck -w @memento/core
          npm run test -w @memento/core

      - name: daemon · typecheck & test
        run: |
          npm run typecheck -w @memento/daemon
          npm run test -w @memento/daemon
          # scripts/project_blueprint.mjs is committed (the server serves it, git hooks run it)
          node packages/daemon/scripts/build-runners.mjs --check

      # BUSINESS_BLUEPRINT.md: the user's rules tied to the code. A rule broken or an anchor gone fails the run
      # (deploy waits for CI); generated regions out of date only warn (the commit hook refreshes them).
      - name: business blueprint · rules hold against the code
        run: |
          node scripts/project_blueprint.mjs --business --root .
          git diff --quiet -- BUSINESS_BLUEPRINT.md || echo "::warning file=BUSINESS_BLUEPRINT.md::生成区域不是最新：本地跑 node scripts/project_blueprint.mjs --business 后提交"

      - name: mcp · typecheck & test
        run: |
          npm run typecheck -w @memento/mcp
          npm run test -w @memento/mcp

      - name: desktop · typecheck, test & bundle
        run: |
          npm run build -w @memento/daemon
          npm run build -w @memento/mcp
          npm run typecheck -w @memento/desktop
          npm run test -w @memento/desktop
          node apps/desktop/scripts/build.mjs

      # The installer and the release tools run straight from .mts (Node 22.18+ strips the types)
      - name: scripts · typecheck & test
        run: |
          npx tsc -p scripts
          node --test scripts/test/*.test.mts

  ts-mobile:
    name: ts · mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: mobile · typecheck & bundle
        working-directory: apps/mobile
        run: |
          npm run build -w @memento/core
          # @expo/cli sits in the root node_modules and must see the app's expo-router
          # (a copy nested under apps/mobile crashes `expo start` / `expo run:ios`).
          node -e "require.resolve('expo-router/package.json', { paths: [require.resolve('@expo/router-server/package.json')] })"
          npx tsc --noEmit
          npx vitest run
          npx expo export --platform android --output-dir /tmp/mobile-export

  ts-web:
    name: ts · web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: core · build dependency
        run: npm run build -w @memento/core

      - name: Next.js cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: web · routes not shadowed by API paths in the proxies
        run: node scripts/check-web-routes.mjs

      - name: web · typecheck & build & lint & test
        run: |
          npm run build -w web
          npm run typecheck -w web
          npm run lint -w web
          npm run test -w web
