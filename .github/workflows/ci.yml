name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.package }} · py${{ matrix.python }}
    runs-on: ubuntu-latest
    # The embedding-sweep and project-placement tests need a real PostgreSQL with pgvector
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: memento_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml

      - name: Install package + dev deps
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: AST syntax check
        working-directory: ${{ matrix.package }}
        run: python -m compileall -q .

      # The Docker image installs server/requirements.lock: it must match uv.lock, and uv.lock must match pyproject.toml
      - name: Dependency lock is current
        working-directory: server
        run: |
          pip install uv==0.10.0
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt | diff - requirements.lock

      # pyflakes rules: undefined names, unused imports/variables, shadowed definitions
      - name: Lint
        run: |
          pip install ruff==0.13.0
          ruff check --isolated --select F server/server server/tests scripts embedding

      - name: pytest
        working-directory: ${{ matrix.package }}
        env:
          MEMENTO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/memento_test
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest -v
          else
            echo "No tests in ${{ matrix.package }}/tests — skipping."
          fi

  web:
    name: ts · core + daemon + mcp + desktop + mobile + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspace at the repo root: packages/*, apps/*, web
      - run: npm ci
        env:
          # Typechecking the desktop app doesn't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: core · typecheck & test
        run: |
          npm run typecheck -w @memento/core
          npm run test -w @memento/core

      - name: daemon · typecheck & test
        run: |
          npm run typecheck -w @memento/daemon
          npm run test -w @memento/daemon

      - name: mcp · typecheck & test
        run: |
          npm run typecheck -w @memento/mcp
          npm run test -w @memento/mcp

      - name: desktop · typecheck & bundle
        run: |
          npm run build -w @memento/daemon
          npm run build -w @memento/mcp
          npm run typecheck -w @memento/desktop
          node apps/desktop/scripts/build.mjs

      - name: mobile · typecheck & bundle
        working-directory: apps/mobile
        run: |
          npm run build -w @memento/core
          # @expo/cli sits in the root node_modules and must see the app's expo-router
          # (a copy nested under apps/mobile crashes `expo start` / `expo run:ios`).
          node -e "require.resolve('expo-router/package.json', { paths: [require.resolve('@expo/router-server/package.json')] })"
          npx tsc --noEmit
          npx expo export --platform android --output-dir /tmp/mobile-export

      - name: web · routes not shadowed by API paths in the proxies
        run: node scripts/check-web-routes.mjs

      - name: web · typecheck & build & lint
        run: |
          npm run build -w web
          npm run typecheck -w web
          npm run lint -w web
