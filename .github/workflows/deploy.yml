name: Build & Deploy (k3s via Fleet)

# 推送到 main 且改了进镜像的文件时:云端构建 server(TypeScript)/web 镜像 → 推 GHCR →
# 回写 deploy/k8s/kustomization.yaml 的镜像 tag。集群里的 Rancher Fleet 监听
# 本仓库 deploy/k8s/,检测到 tag 改动后自动部署到 NAS k3s(pull 式,适配家庭 NAT)。
#
# 快在哪:镜像和 CI 同时构建(只有回写 tag 等 CI 通过);每个镜像只在它自己的输入文件
# 有改动时才构建,没改的镜像保持原 tag、pod 不重启。
# 防递归:bump job 用默认 GITHUB_TOKEN 提交回写,GitHub 对 GITHUB_TOKEN 推送的 commit 不会再触发 workflow。

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      # Build scripts for the embedded database (embedded-pg.yml), not part of any container image
      - "!packages/server/embedded/**"
      - "scripts/project_blueprint.mjs"
      - "scripts/legacy/**"
      - "deploy/bootstrap/**"
      - "data/updates/**"
      - "apps/web/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  OWNER: ddong8

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.diff.outputs.targets }}
      server: ${{ steps.diff.outputs.server }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          SERVER_PATHS="packages/server :(exclude)packages/server/embedded scripts/project_blueprint.mjs scripts/legacy deploy/bootstrap data/updates package.json package-lock.json .dockerignore .github/workflows/deploy.yml"
          WEB_PATHS="apps/web packages/core package.json package-lock.json .dockerignore .github/workflows/deploy.yml"
          deployed_tag() {
            awk -v n="${REGISTRY}/${OWNER}/$1" '$1=="-" && $2=="name:" {cur=$3} $1=="newTag:" && cur==n {gsub(/"/,"",$2); print $2; exit}' deploy/k8s/kustomization.yaml
          }
          changed() {
            local image=$1; shift
            local base; base=$(deployed_tag "$image"); base="${base#ts-}"
            if [ "$EVENT" != "push" ] || [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "$image: 全部构建(线上 tag: ${base:-无})" >&2; echo true; return
            fi
            if git diff --quiet "$base" HEAD -- "$@"; then
              echo "$image: 线上 $base 之后没有改动,不构建" >&2; echo false
            else
              echo "$image: 线上 $base 之后有改动:$(git diff --shortstat "$base" HEAD -- "$@")" >&2; echo true
            fi
          }
          server=$(changed memento-server $SERVER_PATHS)
          web=$(changed memento-web $WEB_PATHS)
          targets=$(jq -cn --argjson s "$server" --argjson w "$web" '[
            (if $s then {name: "server", file: "packages/server/Dockerfile", image: "memento-server"} else empty end),
            (if $w then {name: "web", file: "apps/web/Dockerfile", image: "memento-web"} else empty end)
          ]')
          {
            echo "server=$server"
            echo "web=$web"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"

  wait-ci:
    name: wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow on this commit to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for CI on commit $SHA to complete successfully..."
          for i in $(seq 1 240); do
            status_json=$(gh run list --repo "${{ github.repository }}" --workflow "CI" --commit "$SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -n "$status_json" ]; then
              s=$(echo "$status_json" | jq -r .status)
              c=$(echo "$status_json" | jq -r .conclusion)
              if [ "$s" = "completed" ]; then
                if [ "$c" = "success" ]; then
                  echo "CI passed!"
                  exit 0
                else
                  echo "::error::CI failed with conclusion: $c. Aborting deployment."
                  exit 1
                fi
              fi
              if [ $((i % 3)) -eq 1 ]; then
                echo "CI status: $s, conclusion: $c ($i/240)"
              fi
            else
              if [ $((i % 3)) -eq 1 ]; then
                echo "CI not found yet, waiting... ($i/240)"
              fi
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI to complete (40 minutes)."
          exit 1

  build:
    name: build · ${{ matrix.target.name }}
    needs: [changes]
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          push: true
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.target.image }}:${{ steps.vars.outputs.sha }}

  bump:
    needs: [changes, wait-ci, build]
    if: |
      !cancelled() && needs.build.result == 'success' &&
      (needs.wait-ci.result == 'success' || needs.wait-ci.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.pin.outputs.server }}
      web: ${{ steps.pin.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        run: |
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Pin image tags & push (triggers Fleet)
        id: pin
        env:
          SHA: ${{ github.sha }}
          SERVER: ${{ needs.changes.outputs.server }}
          WEB: ${{ needs.changes.outputs.web }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA_SHORT="${SHA:0:12}"
          images=()
          [ "$SERVER" = true ] && images+=(memento-server)
          [ "$WEB" = true ] && images+=(memento-web)
          for image in "${images[@]}"; do
            docker buildx imagetools create -t "${REGISTRY}/${OWNER}/${image}:latest" "${REGISTRY}/${OWNER}/${image}:${SHA_SHORT}"
          done
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          tag_of() {
            awk -v n="${REGISTRY}/${OWNER}/$1" '$1=="-" && $2=="name:" {cur=$3} $1=="newTag:" && cur==n {gsub(/"/,"",$2); print $2; exit}' deploy/k8s/kustomization.yaml
          }
          pin() {
            pinned=()
            for image in "${images[@]}"; do
              cur=$(tag_of "$image"); cur="${cur#ts-}"
              if [ "$1" = check ] && [ -n "$cur" ] && [ "$cur" != "$SHA_SHORT" ]; then
                rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${cur}...${SHA}" --jq .status 2>/dev/null || echo "查询失败")
                case "$rel" in
                  ahead) ;;
                  behind|diverged) echo "$image: main 上已是 ${cur},本次 ${SHA_SHORT} 相对它是 ${rel},不覆盖"; continue ;;
                  *) echo "$image: 比较 ${cur} 和 ${SHA_SHORT} 失败(${rel})"; return 1 ;;
                esac
              fi
              ( cd deploy/k8s && kustomize edit set image "${REGISTRY}/${OWNER}/${image}=${REGISTRY}/${OWNER}/${image}:${SHA_SHORT}" )
              tag=$(tag_of "$image")
              [ "$tag" = "$SHA_SHORT" ] || { echo "$image 镜像 tag 回写失败(现在是 ${tag:-空})"; return 1; }
              pinned+=("$image")
            done
          }
          finish() {
            s=false; w=false
            for image in "${pinned[@]}"; do
              [ "$image" = memento-server ] && s=true
              [ "$image" = memento-web ] && w=true
            done
            { echo "server=$s"; echo "web=$w"; } >> "$GITHUB_OUTPUT"
            echo "$1"; exit 0
          }
          pin || exit 1
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet && finish "镜像 tag 未变,跳过提交"
          git commit -q -m "ci(deploy): memento 镜像 -> ${SHA_SHORT} (${pinned[*]#memento-}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && finish "已回写并推送,Fleet 将拉取部署"
            echo "push 撞车,重试 $i ..."
            git rebase --abort 2>/dev/null || true
            sleep 3
            git fetch -q origin main && git reset -q --hard origin/main || continue
            pin check || exit 1
            git add deploy/k8s/kustomization.yaml
            git diff --cached --quiet && finish "main 上的镜像 tag 已是本次或更新的提交,不用再回写"
            git commit -q -m "ci(deploy): memento 镜像 -> ${SHA_SHORT} (${pinned[*]#memento-}) [skip ci]"
          done
          echo "回写 push 失败"; exit 1

  verify:
    needs: [changes, bump]
    if: ${{ !cancelled() && needs.bump.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production to run this commit
        env:
          SHA: ${{ github.sha }}
          SERVER: ${{ needs.bump.outputs.server }}
          WEB: ${{ needs.bump.outputs.web }}
        run: |
          SHA_SHORT="${SHA:0:12}"
          server_live() {
            [ "$SERVER" != true ] && return 0
            live=$(curl -fsS --max-time 6 https://mem.ihasy.com/health | jq -r '.version // ""' || true)
            [[ "$live" == *"$SHA_SHORT"* ]] && curl -fsS --max-time 6 -D - -o /dev/null https://mem.ihasy.com/health | grep -iq "^x-memento-server: ts .*$SHA_SHORT"
          }
          web_live() {
            [ "$WEB" != true ] && return 0
            curl -fsS --max-time 8 https://mem.ihasy.com/auth/login 2>/dev/null | grep -q "$SHA_SHORT"
          }
          for i in $(seq 1 150); do
            s=未切换; w=未切换
            server_live && s=已切换
            web_live && w=已切换
            if [ "$s" = 已切换 ] && [ "$w" = 已切换 ]; then echo "线上已是 $SHA_SHORT"; exit 0; fi
            if [ $((i % 5)) -eq 1 ]; then
              echo "等待线上切到 $SHA_SHORT:server $s,web $w(本次构建 server=$SERVER web=$WEB)... ($i/150)"
            fi
            sleep 6
          done
          echo "::error::15 分钟内线上没有切到 $SHA_SHORT。先看 kubectl -n fleet-local get gitrepo memento"
          exit 1
