name: Build & Deploy (k3s via Fleet)

# 推送到 main 且改了服务端/前端代码时:云端构建 server/web 镜像 → 推 GHCR →
# 回写 deploy/k8s/kustomization.yaml 的镜像 tag。集群里的 Rancher Fleet 监听
# 本仓库 deploy/k8s/,检测到 tag 改动后自动部署到 NAS k3s(pull 式,适配家庭 NAT)。
#
# 安全说明(公开仓库):构建跑在 GitHub 托管 runner 上,不在自家网络;只在
# push 到 main 触发(没有 pull_request,fork PR 不会触发),因此只会构建已合入
# main 的代码。集群密钥不在本仓库——Secret 留在 k3s 内,清单只用 secretKeyRef 引用。
#
# 防递归:bump job 用默认 GITHUB_TOKEN 提交回写,GitHub 对 GITHUB_TOKEN 推送
# 的 commit 不会再触发 workflow(这才是真正的防循环机制;[skip ci] 对 GitHub
# Actions 无效,只是给其它工具看的)。另外 deploy/k8s/** 不在下方 paths 内,双保险。
#
# ⚠️ 首跑前置(一次性):首次构建会以 PRIVATE 创建 GHCR 包,集群无 pull secret
# 会 ImagePullBackOff。首次成功后须把两个包设为 Public(见 nas-memento-cicd 文档),
# 之后永久公开。

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/bootstrap/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "data/updates/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true   # 自动部署只关心最新 commit,新 push 取消在途旧 run,避免回写撞车

permissions:
  contents: write   # 回写镜像 tag 到 deploy/k8s
  packages: write   # 推送镜像到 GHCR
  actions: read    # 查询 CI 状态

env:
  REGISTRY: ghcr.io
  OWNER: ddong8

jobs:
  wait-ci:
    name: wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow on this commit to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for CI on commit $SHA to complete successfully..."
          # Up to 40 minutes: a client release (v* tag) pushed together with main builds installers
          # on three platforms first, and CI can sit in the queue behind them.
          # Polling every 5s cuts waiting latency as soon as CI finishes.
          for i in $(seq 1 480); do
            status_json=$(gh run list --repo "${{ github.repository }}" --workflow "CI" --commit "$SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -n "$status_json" ]; then
              s=$(echo "$status_json" | jq -r .status)
              c=$(echo "$status_json" | jq -r .conclusion)
              if [ "$s" = "completed" ]; then
                if [ "$c" = "success" ]; then
                  echo "CI passed!"
                  exit 0
                else
                  echo "::error::CI failed with conclusion: $c. Aborting deployment."
                  exit 1
                fi
              fi
              if [ $((i % 6)) -eq 1 ]; then
                echo "CI status: $s, conclusion: $c ($i/480)"
              fi
            else
              if [ $((i % 6)) -eq 1 ]; then
                echo "CI not found yet, waiting... ($i/480)"
              fi
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for CI to complete (40 minutes)."
          exit 1

  build:
    name: build · ${{ matrix.target.name }}
    needs: [wait-ci]
    if: |
      always() &&
      (needs.wait-ci.result == 'success' || needs.wait-ci.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: server
            file: server/Dockerfile
            image: memento-server
            has_geoip: true
          - name: web
            file: apps/web/Dockerfile
            image: memento-web
            has_geoip: false
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "geoip_month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.target.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          push: true
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha }}
            ${{ matrix.target.has_geoip && format('GEOIP_MONTH={0}', steps.vars.outputs.geoip_month) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.target.image }}:${{ steps.vars.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.target.image }}:latest
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          # 直接下载固定版二进制(走 release CDN),不用 install_kustomize.sh —— 后者查
          # GitHub API 取最新版,在共享 runner 上常撞未认证限流(60/h)导致 bump 失败。
          curl -sfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Pin image tags & push (triggers Fleet)
        env:
          SHA: ${{ github.sha }}
        run: |
          SHA_SHORT="${SHA:0:12}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ( cd deploy/k8s && kustomize edit set image \
              "${REGISTRY}/${OWNER}/memento-server=${REGISTRY}/${OWNER}/memento-server:${SHA_SHORT}" \
              "${REGISTRY}/${OWNER}/memento-web=${REGISTRY}/${OWNER}/memento-web:${SHA_SHORT}" )
          # 断言 tag 确实回写成功
          grep -q "memento-server" deploy/k8s/kustomization.yaml && grep -q "${SHA_SHORT}" deploy/k8s/kustomization.yaml \
            || { echo "镜像 tag 回写失败"; exit 1; }
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "镜像 tag 未变,跳过提交"
            exit 0
          fi
          git commit -m "ci(deploy): memento 镜像 -> ${SHA_SHORT} [skip ci]"
          # 串行 run 之间可能有新 commit 落到 main,push 前先 rebase,失败重试
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "已回写并推送,Fleet 将拉取部署"
              exit 0
            fi
            echo "push 撞车,重试 $i ..."
            sleep 3
          done
          echo "回写 push 失败"; exit 1

  # 回写 tag 只说明"该部署了"。等线上 /health 报出这次的提交号才算真正上线;
  # Fleet 卡住(gitrepo Stalled)等情况会在这里超时失败,不再静默。
  verify:
    needs: [build, bump]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for production to run this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          SHA_SHORT="${SHA:0:12}"
          for i in $(seq 1 150); do
            live=$(curl -fsS --max-time 6 https://mem.ihasy.com/health | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)
            if [ "$live" = "$SHA_SHORT" ] || [[ "$live" == *"$SHA_SHORT"* ]]; then echo "线上已是 $SHA_SHORT"; exit 0; fi
            if [ $((i % 5)) -eq 1 ]; then
              echo "线上版本 ${live:-无响应},等待 $SHA_SHORT ... ($i/150)"
            fi
            sleep 6
          done
          echo "::error::15 分钟内线上没有切到 $SHA_SHORT。先看 kubectl -n fleet-local get gitrepo memento,Stalled 时按 CLAUDE.md 强制重同步(forceSyncGeneration+1)"
          exit 1
