name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.3)"
        required: false
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Electron desktop app (apps/desktop) for macOS, Windows and Linux.
  build-electron:
    name: Build Electron (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm cache on Linux only: a run for a tag can only restore caches saved on main, and only CI
      # on Linux saves one there. On macOS/Windows each release just stored ~170 MB that no later
      # release could read, crowding the repository's 10 GB of caches.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ matrix.os == 'ubuntu-latest' && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --workspace @memento/desktop --workspace @memento/daemon --workspace @memento/mcp --workspace @memento/core --include-workspace-root

      - name: Version from tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          if [ -z "$VERSION" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then VERSION="${{ github.ref_name }}"; fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build -w @memento/desktop

      - name: Package
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 2

  # Android APK (apps/mobile), in its own workflow so main can warm its Gradle cache. The release
  # doesn't wait for it: the desktop downloads go out first and attach-apk adds the APK after.
  android:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ github.event.inputs.tag_name || github.ref_name }}

  publish-release:
    name: Publish GitHub Release & Update Version Metadata
    needs: [build-electron]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - name: Checkout repo for version metadata update
        uses: actions/checkout@v4
        with:
          ref: main

      # scripts/release-metadata.mts runs as TypeScript directly, which needs Node 22.18+
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: dist

      - name: Prepare Release Tag
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            DEFAULT_VER=$(node -p "require('./apps/desktop/package.json').version")
            echo "tag=v${DEFAULT_VER}" >> $GITHUB_OUTPUT
          fi

      # The release commit writes this version's notes into data/updates/version.json (the in-app
      # updater shows them too): use them as the release body, GitHub's commit list only without them
      - name: Release notes
        id: notes
        run: node scripts/release-metadata.mts notes

      - name: Upload Assets & Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Memento ${{ steps.release_meta.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          make_latest: true
          files: |
            dist/electron-*/*

      # Windows / macOS point at the hot-replaceable .zip (installer only as a fallback), Linux at the
      # .tar.gz; the electron channel YAML is copied next to it so the server hosts it too
      - name: Update data/updates/version.json
        run: node scripts/release-metadata.mts update --tag "${{ steps.release_meta.outputs.tag }}"

      - name: Verify release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-metadata.mts verify --github-tag "${{ steps.release_meta.outputs.tag }}"

      - name: Commit and push updated version metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/updates/version.json data/updates/latest*.yml
          if git diff --cached --quiet; then
            echo "Version metadata unchanged, skipping commit."
          else
            git commit -m "ci(release): bump update distribution metadata to ${{ steps.release_meta.outputs.tag }} [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully updated version.json and channel yml"
                break
              fi
              sleep 3
            done
          fi

  attach-apk:
    name: Attach Android APK
    needs: [android, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.tag }}
        run: gh release upload "$TAG" apk/*.apk --clobber --repo "${{ github.repository }}"
