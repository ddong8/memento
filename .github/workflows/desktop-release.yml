name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.3)"
        required: false
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Electron desktop app (apps/desktop) for macOS, Windows and Linux.
  build-electron:
    name: Build Electron (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Windows
            os: windows-latest
            args: --win
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # npm cache on Linux only: a run for a tag can only restore caches saved on main, and only CI
      # on Linux saves one there. On macOS/Windows each release just stored ~170 MB that no later
      # release could read, crowding the repository's 10 GB of caches.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ matrix.os == 'ubuntu-latest' && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --workspace @memento/desktop --workspace @memento/daemon --workspace @memento/mcp --workspace @memento/core --include-workspace-root

      - name: Version from tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          if [ -z "$VERSION" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then VERSION="${{ github.ref_name }}"; fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/desktop/package.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build -w @memento/desktop

      - name: Package
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 2

  # Android APK (apps/mobile), in its own workflow so main can warm its Gradle cache. The release
  # doesn't wait for it: the desktop downloads go out first and attach-apk adds the APK after.
  android:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ github.event.inputs.tag_name || github.ref_name }}

  publish-release:
    name: Publish GitHub Release & Update Version Metadata
    needs: [build-electron]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - name: Checkout repo for version metadata update
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: dist

      - name: Prepare Release Tag
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            DEFAULT_VER=$(node -p "require('./apps/desktop/package.json').version")
            echo "tag=v${DEFAULT_VER}" >> $GITHUB_OUTPUT
          fi

      # The release commit writes this version's notes into data/updates/version.json (the in-app
      # updater shows them too): use them as the release body, GitHub's commit list only without them
      - name: Release notes
        id: notes
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          meta = json.loads(pathlib.Path("data/updates/version.json").read_text(encoding="utf-8"))
          notes = str(meta.get("release_notes") or "").strip()
          pathlib.Path("release-notes.md").write_text(notes + "\n" if notes else "", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_notes={'true' if notes else 'false'}\n")
          PY

      - name: Upload Assets & Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Memento ${{ steps.release_meta.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          make_latest: true
          files: |
            dist/electron-*/*

      - name: Update data/updates/version.json
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          VER="${TAG#v}"
          python3 -c "
          import hashlib, json, os, glob
          from pathlib import Path

          def calc_sha256(filepath):
              h = hashlib.sha256()
              with open(filepath, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              return h.hexdigest()

          ver_file = Path('data/updates/version.json')
          ver_file.parent.mkdir(parents=True, exist_ok=True)
          meta = {}
          if ver_file.exists():
              try:
                  with open(ver_file, 'r', encoding='utf-8') as f:
                      meta = json.load(f)
              except Exception:
                  meta = {}

          meta['version'] = '$VER'
          meta['title'] = f'Memento v$VER'
          if 'platforms' not in meta:
              meta['platforms'] = {}

          all_files = glob.glob('dist/**/*', recursive=True)

          # Find windows asset (prefer .zip for in-place hot-replacement, fallback setup.exe / .exe)
          for p in all_files:
              if not os.path.isfile(p):
                  continue
              fn = os.path.basename(p)
              fn_lower = fn.lower()
              if ('win' in fn_lower or 'windows' in fn_lower) and fn_lower.endswith('.zip') and not fn_lower.endswith('.blockmap'):
                  meta['platforms']['windows'] = {
                      'asset_name': fn,
                      'size': os.path.getsize(p),
                      'sha256': calc_sha256(p)
                  }
                  break
          if 'windows' not in meta.get('platforms', {}):
              for p in all_files:
                  if not os.path.isfile(p):
                      continue
                  fn = os.path.basename(p)
                  fn_lower = fn.lower()
                  if ('win' in fn_lower or 'windows' in fn_lower) and fn_lower.endswith('.exe') and not fn_lower.endswith('.blockmap'):
                      meta['platforms']['windows'] = {
                          'asset_name': fn,
                          'size': os.path.getsize(p),
                          'sha256': calc_sha256(p)
                      }
                      break

          # Find macos asset (prefer .zip for hot-update, fallback .dmg)
          for p in all_files:
              if not os.path.isfile(p):
                  continue
              fn = os.path.basename(p)
              fn_lower = fn.lower()
              if ('mac' in fn_lower or 'darwin' in fn_lower) and fn_lower.endswith('.zip') and not fn_lower.endswith('.blockmap'):
                  meta['platforms']['macos'] = {
                      'asset_name': fn,
                      'size': os.path.getsize(p),
                      'sha256': calc_sha256(p)
                  }
                  break
          if 'macos' not in meta.get('platforms', {}):
              for p in all_files:
                  if not os.path.isfile(p):
                      continue
                  fn = os.path.basename(p)
                  fn_lower = fn.lower()
                  if ('mac' in fn_lower or 'darwin' in fn_lower) and fn_lower.endswith('.dmg'):
                      meta['platforms']['macos'] = {
                          'asset_name': fn,
                          'size': os.path.getsize(p),
                          'sha256': calc_sha256(p)
                      }
                      break

          # Find linux asset (prefer .tar.gz / .zip, fallback .AppImage / .deb)
          for p in all_files:
              if not os.path.isfile(p):
                  continue
              fn = os.path.basename(p)
              fn_lower = fn.lower()
              if 'linux' in fn_lower and (fn_lower.endswith('.tar.gz') or fn_lower.endswith('.zip')):
                  meta['platforms']['linux'] = {
                      'asset_name': fn,
                      'size': os.path.getsize(p),
                      'sha256': calc_sha256(p)
                  }
                  break
          if 'linux' not in meta.get('platforms', {}):
              for p in all_files:
                  if not os.path.isfile(p):
                      continue
                  fn = os.path.basename(p)
                  fn_lower = fn.lower()
                  if 'linux' in fn_lower and (fn_lower.endswith('.appimage') or fn_lower.endswith('.deb')):
                      meta['platforms']['linux'] = {
                          'asset_name': fn,
                          'size': os.path.getsize(p),
                          'sha256': calc_sha256(p)
                      }
                      break

          with open(ver_file, 'w', encoding='utf-8') as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          "

      - name: Verify release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_release_metadata.py --github-tag "${{ steps.release_meta.outputs.tag }}"

      - name: Commit and push updated version metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/updates/version.json
          if git diff --cached --quiet; then
            echo "Version metadata unchanged, skipping commit."
          else
            git commit -m "ci(release): bump update distribution metadata to ${{ steps.release_meta.outputs.tag }} [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully updated version.json"
                break
              fi
              sleep 3
            done
          fi

  attach-apk:
    name: Attach Android APK
    needs: [android, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Upload the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.tag }}
        run: gh release upload "$TAG" apk/*.apk --clobber --repo "${{ github.repository }}"
