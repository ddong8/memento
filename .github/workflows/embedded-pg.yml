# pgvector for the embedded Postgres the single installer will ship (docs/ts-server-migration.md, P0 / P7):
# built on each platform and loaded into embedded-postgres 16 to check vectors, HNSW and Chinese full-text work.
# Results are uploaded as artifacts (pgvector-<platform>); packages/server/embedded/ has the scripts.
name: Embedded Postgres + pgvector

on:
  push:
    branches: [main]
    paths:
      - "packages/server/embedded/**"
      - ".github/workflows/embedded-pg.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EMBEDDED_PG: 16.16.0-beta.19
  PGVECTOR_VERSION: 0.8.1

jobs:
  build:
    name: pgvector · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-14 }
          - { platform: darwin-x64, os: macos-15-intel }
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: win32-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: packages/server/embedded/build-pgvector.sh

      - name: PostgreSQL 16 headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install postgresql16 --no-progress -y --params "/Password:ci-only /NoPath" | Out-Null
          "PGROOT=C:\Program Files\PostgreSQL\16" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packages/server/embedded/build-pgvector.ps1

      - name: Load into embedded Postgres and check
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/embv" && cd "$RUNNER_TEMP/embv"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "embedded-postgres@${EMBEDDED_PG}"
          node "$GITHUB_WORKSPACE/packages/server/embedded/verify.mjs" "$GITHUB_WORKSPACE/packages/server/embedded/out/${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pgvector-${{ matrix.platform }}
          path: packages/server/embedded/out/${{ matrix.platform }}
          retention-days: 90
