appId: com.ihasy.memento.desktop
productName: Memento
artifactName: Memento-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - assets/**
  - package.json
# The daemon (utility process) and the MCP server (started by AI tools) run from disk.
asarUnpack:
  - dist/daemon.mjs
  - dist/mcp.mjs
  - assets/**
publish:
  provider: github
  owner: ddong8
  repo: memento
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  # No Developer ID yet: ad-hoc signed in CI with a stable designated
  # requirement (afterSign), so auto-updates keep the same identity.
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Memento
linux:
  # The default comes from the npm name (@memento/desktop), which isn't a valid file name.
  executableName: memento
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  icon: build/icon.png
  category: Development
afterSign: scripts/after-sign.cjs
