appId: com.ihasy.memento.desktop
productName: Memento
artifactName: Memento-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - assets/**
  - package.json
# The daemon (utility process), embedded server and the MCP server run from disk.
asarUnpack:
  - dist/daemon.mjs
  - dist/mcp.mjs
  - dist/server/**
  - dist/embedded-pg/**
  - dist/pgvector/**
  - dist/node_modules/**
  - assets/**
publish:
  provider: generic
  url: https://mem.ihasy.com/api/system/update
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  # Without a Developer ID in the repository's secrets: ad-hoc signed in CI with a stable designated
  # requirement (afterSign), so auto-updates keep the same identity. With one, desktop-release.yml
  # passes the identity, the hardened runtime and build/entitlements.mac.plist, and notarizes.
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: false
    CFBundleDisplayName: Memento
    CFBundleName: Memento
    # Asked for under the hardened runtime of a Developer ID build (osascript in updates)
    NSAppleEventsUsageDescription: Memento 更新自身和打开其他应用时需要发送 Apple 事件。
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Memento
linux:
  # The default comes from the npm name (@memento/desktop), which isn't a valid file name.
  executableName: memento
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  icon: build/icon.png
  category: Development
afterSign: scripts/after-sign.cjs
