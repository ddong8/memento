<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memento</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5fa;
    --card: rgba(255, 255, 255, 0.76);
    --surface-mute: rgba(244, 241, 251, 0.72);
    --fg: #14121e;
    --fg2: #3a354b;
    --muted: #625c75;
    --border: rgba(24, 18, 42, 0.085);
    --border-strong: rgba(24, 18, 42, 0.14);
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.09);
    --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.94), inset 0 0 0 1px rgba(255, 255, 255, 0.48), 0 24px 56px -22px rgba(32, 20, 64, 0.18), 0 4px 12px -2px rgba(20, 16, 36, 0.06);
    --orb1: rgba(124, 58, 237, 0.11);
    --orb2: rgba(236, 72, 153, 0.075);
    --orb3: rgba(6, 182, 212, 0.075);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0a12;
      --card: rgba(24, 21, 36, 0.72);
      --surface-mute: rgba(31, 27, 46, 0.62);
      --fg: #f5f4fa;
      --fg2: #cbc7db;
      --muted: #9993ad;
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #7c3aed;
      --accent-hover: #8b5cf6;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13), inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 28px 64px -20px rgba(0, 0, 0, 0.76);
      --orb1: rgba(124, 58, 237, 0.22);
      --orb2: rgba(236, 72, 153, 0.14);
      --orb3: rgba(6, 182, 212, 0.13);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Adwaita Sans", Cantarell, Ubuntu, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-app-region: drag;
    user-select: none;
    overflow: hidden;
    position: relative;
  }
  .ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .ambient span {
    position: absolute;
    border-radius: 50%;
    filter: blur(95px);
  }
  .ambient .a1 { width: 420px; height: 420px; top: -140px; left: -90px; background: var(--orb1); }
  .ambient .a2 { width: 360px; height: 360px; top: 10%; right: -110px; background: var(--orb2); }
  .ambient .a3 { width: 380px; height: 380px; bottom: -160px; left: 25%; background: var(--orb3); }
  main {
    position: relative;
    z-index: 1;
    width: min(420px, 92vw);
    padding: 36px 30px 32px;
    border-radius: 20px;
    background: var(--card);
    backdrop-filter: blur(30px) saturate(185%);
    -webkit-backdrop-filter: blur(30px) saturate(185%);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .brand {
    width: 52px;
    height: 52px;
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.3;
  }
  #step {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 18px;
    min-height: 22px;
    word-break: break-word;
  }
  .progress {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  .spinner.stopped {
    animation: none;
    border-color: var(--danger);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #err {
    display: none;
    color: var(--danger);
    background: var(--danger-soft);
    font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, "PingFang SC", "Microsoft YaHei UI", monospace;
    font-size: 12.5px;
    line-height: 1.55;
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin: 0 0 18px;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    -webkit-app-region: no-drag;
  }
  .actions {
    display: none;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    -webkit-app-region: no-drag;
  }
  .actions.show { display: flex; }
  button {
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 9px 16px;
    font: 500 13.5px/1.2 inherit;
    cursor: pointer;
    background: var(--surface-mute);
    color: var(--fg);
    transition: background-color 160ms ease, border-color 160ms ease, opacity 140ms ease;
  }
  button:hover { opacity: 0.92; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    border-color: transparent;
    background: var(--accent);
    color: #ffffff;
  }
  button.primary:hover { background: var(--accent-hover); opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.8s; }
    button { transition: none; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<main>
  <svg class="brand" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="memento-boot-g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7C3AED"/>
        <stop offset="55%" stop-color="#EC4899"/>
        <stop offset="100%" stop-color="#06B6D4"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#memento-boot-g)"/>
    <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/>
      <path d="M19 14l.7 2.3L22 17l-2.3.7L19 20l-.7-2.3L16 17l2.3-.7z"/>
    </g>
  </svg>
  <h1 id="title">正在启动 Memento 本机服务</h1>
  <div class="progress">
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <p id="step" style="margin:0;">准备内置数据库与本地工作台…</p>
  </div>
  <div id="err"></div>
  <div id="actions" class="actions">
    <button id="retry" class="primary">重试启动</button>
    <button id="cloud">改连云端服务</button>
  </div>
</main>
<script>
  const stepEl = document.getElementById("step");
  const errEl = document.getElementById("err");
  const titleEl = document.getElementById("title");
  const spinnerEl = document.getElementById("spinner");
  const actionsEl = document.getElementById("actions");

  window.__mementoBootProgress = (line) => {
    if (line) stepEl.textContent = String(line);
  };
  window.__mementoBootError = (msg) => {
    titleEl.textContent = "本机服务启动失败";
    stepEl.textContent = "可以重试本机启动，或切换到云端/私有化服务器。";
    spinnerEl.classList.add("stopped");
    errEl.textContent = String(msg || "未知错误");
    errEl.style.display = "block";
    actionsEl.classList.add("show");
  };
  if (window.mementoDesktop && window.mementoDesktop.localServer && window.mementoDesktop.localServer.onProgress) {
    window.mementoDesktop.localServer.onProgress((line) => window.__mementoBootProgress(line));
  }
  document.getElementById("retry").onclick = () => {
    errEl.style.display = "none";
    actionsEl.classList.remove("show");
    spinnerEl.classList.remove("stopped");
    titleEl.textContent = "正在启动 Memento 本机服务";
    stepEl.textContent = "重新启动内置数据库与服务…";
    if (window.mementoDesktop && window.mementoDesktop.localServer && window.mementoDesktop.localServer.bootRetry) {
      window.mementoDesktop.localServer.bootRetry();
    } else {
      location.reload();
    }
  };
  document.getElementById("cloud").onclick = () => {
    if (window.mementoDesktop && window.mementoDesktop.localServer && window.mementoDesktop.localServer.bootUseCloud) {
      window.mementoDesktop.localServer.bootUseCloud();
    } else {
      location.href = "https://mem.ihasy.com/auth/login";
    }
  };
</script>
</body>
</html>
