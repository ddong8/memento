# memento 企业私有化部署（单机 docker compose），说明见 docs/enterprise.md。
# 用 ./memento.sh init 生成 .env 后 ./memento.sh up 启动。所有配置都在 .env 里，这个文件不用改。
name: memento-enterprise

x-server: &server
  image: ${MEMENTO_SERVER_IMAGE:-ghcr.io/ddong8/memento-server}:${MEMENTO_SERVER_TAG:?先运行 ./memento.sh init}
  restart: unless-stopped
  env_file: .env
  environment:
    MEMENTO_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/memento
    MEMENTO_REDIS_URL: redis://redis:6379/0
    MEMENTO_S3_ENDPOINT: http://minio:9000
    MEMENTO_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    MEMENTO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MEMENTO_PORT: "8000"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_started }

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: memento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c max_connections=200
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=120000
      -c log_lock_waits=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO stopped publishing free images in 2025-10 (minio/minio is gone from Docker Hub, Quay needs a login):
  # Chainguard's free build of it, amd64 + arm64. Run as root so volumes made by the old image stay writable.
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  api:
    <<: *server
    environment:
      MEMENTO_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/memento
      MEMENTO_REDIS_URL: redis://redis:6379/0
      MEMENTO_S3_ENDPOINT: http://minio:9000
      MEMENTO_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      MEMENTO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MEMENTO_PORT: "8000"
      MEMENTO_ENABLE_SCHEDULER: "true"
    command: ["node", "--enable-source-maps", "dist/main.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  web:
    image: ${MEMENTO_WEB_IMAGE:-ghcr.io/ddong8/memento-web}:${MEMENTO_WEB_TAG:?先运行 ./memento.sh init}
    restart: unless-stopped
    depends_on:
      - api

  # The single entrance: /api, /health, /install... to the api, everything else to the web app.
  # HTTPS by itself for a public domain; see MEMENTO_TLS in .env for intranet names and plain HTTP.
  proxy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MEMENTO_HTTP_PORT:-80}:80"
      - "${MEMENTO_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
