# The TypeScript server (packages/server) — sole production API, WebSocket & scheduled-jobs server.
# Runs an idempotent DB migration initContainer (pg_advisory_xact_lock) before rolling out replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ts
spec:
  replicas: 2
  selector: { matchLabels: { app: api-ts } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: api-ts } }
    spec:
      # 10s preStop + graceful shutdown + up to 600s for active agent runs to finish or hand over
      terminationGracePeriodSeconds: 660
      initContainers:
        - name: db-migrate
          image: ghcr.io/ddong8/memento-server:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "if [ -f dist/migrate.mjs ]; then node --enable-source-maps dist/migrate.mjs; fi"]
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      containers:
        - name: api-ts
          image: ghcr.io/ddong8/memento-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          env:
            - name: MEMENTO_SKIP_DDL_MIGRATIONS
              value: "1"
            - name: MEMENTO_ENABLE_SCHEDULER
              value: "true"
            - name: MEMENTO_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_USER } }
            - name: MEMENTO_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_PASSWORD } }
            - name: MEMENTO_APNS_AUTH_KEY
              valueFrom: { secretKeyRef: { name: memento-apns, key: auth_key, optional: true } }
            - name: MEMENTO_APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: key_id, optional: true } }
            - name: MEMENTO_APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: team_id, optional: true } }
            - name: MEMENTO_APNS_BUNDLE_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: bundle_id, optional: true } }
            - name: MEMENTO_STUDIO_FILMKIT_TOKEN
              valueFrom: { secretKeyRef: { name: memento-studio, key: filmkit_token, optional: true } }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            # Let Traefik take the pod out of rotation before it stops
            preStop:
              sleep: { seconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: media-cache
              mountPath: /data2
      volumes:
        - name: media-cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-ts
spec:
  selector: { app: api-ts }
  ports:
    - port: 8000
      targetPort: 8000
---
# Keep the canonical `api` Service DNS pointing at api-ts so web SSR and internal callers keep working seamlessly.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api-ts }
  ports:
    - port: 8000
      targetPort: 8000
