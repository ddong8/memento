# The TypeScript server (packages/server, docs/ts-server-migration.md), next to the Python api.
# Same configuration and secrets; the entrance (ingress.yaml) sends it only the paths it has taken over.
# The image lives in the public memento-server package under ts-<commit> tags (a new package would start
# private and the cluster couldn't pull it); kustomization.yaml maps the memento-server-ts name to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ts
spec:
  replicas: 2
  selector: { matchLabels: { app: api-ts } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: api-ts } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-ts
          image: ghcr.io/ddong8/memento-server-ts:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          env:
            - name: MEMENTO_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_USER } }
            - name: MEMENTO_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_PASSWORD } }
            - name: MEMENTO_APNS_AUTH_KEY
              valueFrom: { secretKeyRef: { name: memento-apns, key: auth_key, optional: true } }
            - name: MEMENTO_APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: key_id, optional: true } }
            - name: MEMENTO_APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: team_id, optional: true } }
            - name: MEMENTO_APNS_BUNDLE_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: bundle_id, optional: true } }
            - name: MEMENTO_STUDIO_FILMKIT_TOKEN
              valueFrom: { secretKeyRef: { name: memento-studio, key: filmkit_token, optional: true } }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            # Let Traefik take the pod out of rotation before it stops
            preStop:
              sleep: { seconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: media-cache
              mountPath: /data2
      volumes:
        - name: media-cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-ts
spec:
  selector: { app: api-ts }
  ports:
    - port: 8000
      targetPort: 8000
