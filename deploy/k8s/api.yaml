apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # 多副本:副本间经 Redis 协调,见 server/server/services/cluster.py
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      # 10s preStop + uvicorn 最多 25s 优雅退出(见 server/Dockerfile)
      # + 最多 600s 等进行中的回答跑完(MEMENTO_SHUTDOWN_DRAIN_SECONDS,客户端期间改连新 pod 继续看),留 25s 余量
      terminationGracePeriodSeconds: 660
      containers:
        - name: api
          image: ghcr.io/ddong8/memento-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          env:
            - name: MEMENTO_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_USER } }
            - name: MEMENTO_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_PASSWORD } }
            - name: MEMENTO_APNS_AUTH_KEY
              valueFrom: { secretKeyRef: { name: memento-apns, key: auth_key, optional: true } }
            - name: MEMENTO_APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: key_id, optional: true } }
            - name: MEMENTO_APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: team_id, optional: true } }
            - name: MEMENTO_APNS_BUNDLE_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: bundle_id, optional: true } }
          ports:
            - containerPort: 8000
          # 启动约 2 秒就能接请求:早点开始探测,滚动更新时每个副本少等十几秒(两个副本逐个替换)。
          # 摘流量的容忍时间不变,仍是连续失败 2 分钟
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 24
          lifecycle:
            # 先等网关(Traefik)把这个 pod 从后端摘掉再停:滚动更新时旧 pod 继续接请求,不再有几秒的 502
            preStop:
              sleep: { seconds: 10 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - name: media-cache
              mountPath: /data2
      volumes:
        - name: media-cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
