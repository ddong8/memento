apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector: { matchLabels: { app: celery-worker } }
  template:
    metadata: { labels: { app: celery-worker } }
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/ddong8/memento-server:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "server.tasks.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          env:
            - name: MEMENTO_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_USER } }
            - name: MEMENTO_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: memento-secret, key: MINIO_ROOT_PASSWORD } }
            - name: MEMENTO_APNS_AUTH_KEY
              valueFrom: { secretKeyRef: { name: memento-apns, key: auth_key, optional: true } }
            - name: MEMENTO_APNS_KEY_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: key_id, optional: true } }
            - name: MEMENTO_APNS_TEAM_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: team_id, optional: true } }
            - name: MEMENTO_APNS_BUNDLE_ID
              valueFrom: { secretKeyRef: { name: memento-apns, key: bundle_id, optional: true } }
          # A hung worker (stuck event loop, lost broker connection) is restarted instead of
          # silently running nothing; the ping itself takes under a second.
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A server.tasks.celery_app inspect ping -d celery@$HOSTNAME --timeout 15"]
            initialDelaySeconds: 120
            periodSeconds: 120
            timeoutSeconds: 40
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  selector: { matchLabels: { app: celery-beat } }
  template:
    metadata: { labels: { app: celery-beat } }
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/ddong8/memento-server:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "server.tasks.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: memento-config }
            - secretRef: { name: memento-secret }
          # Beat rewrites its schedule file as it sends tasks (one is due every minute); a file
          # left alone for 10 minutes means beat stopped scheduling.
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$(find /app/celerybeat-schedule -mmin -10)\""]
            initialDelaySeconds: 300
            periodSeconds: 120
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
