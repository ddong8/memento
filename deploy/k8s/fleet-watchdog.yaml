# Fleet 卡住自动重同步（Node 22 原生脚本，复用 memento-server 镜像，不额外拉镜像）。
# 每 3 分钟检查一次：gitrepo Stalled 持续 3 分钟以上且距上次重同步超过 5 分钟时，
# 把 forceSyncGeneration 加 1 触发重新拉取；同时清理手动 kubectl set image 遗留的字段归属冲突。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-watchdog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memento-fleet-watchdog
rules:
- apiGroups: ["fleet.cattle.io"]
  resources: ["gitrepos"]
  resourceNames: ["memento"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memento-fleet-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: memento-fleet-watchdog
subjects:
- kind: ServiceAccount
  name: fleet-watchdog
  namespace: memento
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memento-fleet-watchdog-deploys
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memento-fleet-watchdog-deploys
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memento-fleet-watchdog-deploys
subjects:
- kind: ServiceAccount
  name: fleet-watchdog
  namespace: memento
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-watchdog
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: fleet-watchdog
          restartPolicy: Never
          containers:
          - name: watchdog
            image: ghcr.io/ddong8/memento-server:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 200m, memory: 128Mi}
            command: ["node", "-e"]
            args:
            - |
              const fs = require("node:fs");
              const https = require("node:https");

              const SA = "/var/run/secrets/kubernetes.io/serviceaccount";
              const host = process.env.KUBERNETES_SERVICE_HOST;
              const port = process.env.KUBERNETES_SERVICE_PORT;
              const token = fs.readFileSync(`${SA}/token`, "utf8").trim();
              const ca = fs.readFileSync(`${SA}/ca.crt`);
              const ANN = "memento.ihasy.com/watchdog-resync-at";
              const STALLED_FOR = 180;
              const GAP = 300;

              function call(method, path, body, ctype = "application/json") {
                return new Promise((resolve, reject) => {
                  const data = body ? Buffer.from(JSON.stringify(body), "utf8") : null;
                  const req = https.request(
                    {
                      host,
                      port,
                      path,
                      method,
                      ca,
                      timeout: 20000,
                      headers: {
                        Authorization: `Bearer ${token}`,
                        "Content-Type": ctype,
                        ...(data ? { "Content-Length": data.length } : {}),
                      },
                    },
                    (res) => {
                      const chunks = [];
                      res.on("data", (c) => chunks.push(c));
                      res.on("end", () => {
                        const raw = Buffer.concat(chunks).toString("utf8");
                        if (res.statusCode >= 400) return reject(new Error(`HTTP ${res.statusCode}: ${raw.slice(0, 200)}`));
                        resolve(raw ? JSON.parse(raw) : {});
                      });
                    },
                  );
                  req.on("error", reject);
                  req.on("timeout", () => req.destroy(new Error("timeout")));
                  if (data) req.write(data);
                  req.end();
                });
              }

              (async () => {
                const depPath = "/apis/apps/v1/namespaces/memento/deployments";
                try {
                  const deps = await call("GET", depPath);
                  for (const d of deps.items || []) {
                    const mfs = d.metadata?.managedFields || [];
                    const bad = mfs
                      .map((m, i) => [i, m])
                      .filter(([, m]) => String(m.manager || "").startsWith("kubectl") && m.operation === "Update" && JSON.stringify(m.fieldsV1 || {}).includes('"f:image"'));
                    if (!bad.length) continue;
                    const ops = [];
                    for (const [i, m] of bad.reverse()) {
                      ops.push({ op: "test", path: `/metadata/managedFields/${i}/manager`, value: m.manager });
                      ops.push({ op: "remove", path: `/metadata/managedFields/${i}` });
                    }
                    await call("PATCH", `${depPath}/${d.metadata.name}`, ops, "application/json-patch+json");
                    console.log(`cleared manual image ownership on deploy/${d.metadata.name}`);
                  }
                } catch (e) {
                  console.log("manual-ownership check failed:", e.message);
                }

                const repoPath = "/apis/fleet.cattle.io/v1alpha1/namespaces/fleet-local/gitrepos/memento";
                const g = await call("GET", repoPath);
                const now = Date.now() / 1000;
                const cond = (g.status?.conditions || []).find((c) => c.type === "Stalled") || {};
                if (cond.status !== "True") {
                  console.log("ok: not stalled");
                  return;
                }
                const stalled = now - Date.parse(cond.lastUpdateTime) / 1000;
                const last = Number((g.metadata?.annotations || {})[ANN] || 0);
                if (stalled < STALLED_FOR || now - last < GAP) {
                  console.log(`stalled ${Math.round(stalled)}s, last resync ${Math.round(now - last)}s ago: wait`);
                  return;
                }
                const gen = Number(g.spec?.forceSyncGeneration || 0) + 1;
                await call("PATCH", repoPath, { metadata: { annotations: { [ANN]: String(Math.floor(now)) } }, spec: { forceSyncGeneration: gen } }, "application/merge-patch+json");
                console.log(`stalled ${Math.round(stalled)}s: forceSyncGeneration -> ${gen}`);
              })().catch((e) => {
                console.error(e);
                process.exit(1);
              });
