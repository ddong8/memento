apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memento
spec:
  ingressClassName: traefik
  rules:
    - host: mem.ihasy.com
      http:
        paths:
          # 100% of API, health, install & quota endpoints are now served by the TypeScript server (packages/server).
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-ts, port: { number: 8000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: api-ts, port: { number: 8000 } } }
          - path: /install
            pathType: Prefix
            backend: { service: { name: api-ts, port: { number: 8000 } } }
          - path: /agent/quotas
            pathType: Prefix
            backend: { service: { name: api-ts, port: { number: 8000 } } }
          - path: /quotas
            pathType: Prefix
            backend: { service: { name: api-ts, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 3000 } } }
