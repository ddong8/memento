apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memento

resources:
- api.yaml
- celery.yaml
- web.yaml
- ingress.yaml

# memento-config 用 generator:内容变化时名字带新 hash → 自动滚动 api/worker/beat,
# 避免改了 EMBEDDING_* / AI_MODEL 却不生效。kustomize 会自动把各 Deployment
# 里 configMapRef: memento-config 的引用改写成带 hash 的名字。
# 向量化走硅基流动的 BAAI/bge-m3(OpenAI 兼容接口),Key 在集群 Secret 的
# MEMENTO_EMBEDDING_API_KEY 里。换回自建 bge-m3 服务:PROVIDER=local 并配
# MEMENTO_EMBEDDING_SERVER_URL(内网地址不写进公开仓库,放集群里)。
  # 远程任务执行:允许从 Web / ask 的 agent 模式把 shell 或 agent 任务派到
  # 自己的设备上执行。设备端无需任何配置 —— 打开后,collector 下次心跳会
  # 领到服务端为它签发的专属密钥(每设备一把,存本地 0600 文件)。
  # 关掉这个开关即可全局停用:心跳不再下发密钥,已有设备的密钥也不再被接受。
  # 大模型走 DeepSeek 官方接口(OpenAI 兼容),Key 在集群 Secret 的 MEMENTO_AI_API_KEY 里;
  # 备用的 OneAPI Key 在 MEMENTO_AI_FALLBACK_API_KEY 里。deepseek-flash 能看图(提问带图片要用),
  # 后台抽取/摘要会带 thinking=disabled 关掉思考。
configMapGenerator:
- literals:
  - MEMENTO_REDIS_URL=redis://redis:6379/0
  - MEMENTO_S3_ENDPOINT=http://minio:9000
  - MEMENTO_EMBEDDING_PROVIDER=openai
  - MEMENTO_EMBEDDING_API_URL=https://api.siliconflow.cn/v1
  - MEMENTO_EMBEDDING_MODEL=BAAI/bge-m3
  - MEMENTO_AI_BASE_URL=https://api.deepseek.com
  - MEMENTO_AI_MODEL=deepseek-flash
  - MEMENTO_AI_BACKGROUND_MODEL=deepseek-flash
  - MEMENTO_PORT=8000
  - MEMENTO_PUBLIC_URL=https://mem.ihasy.com
  - MEMENTO_REMOTE_EXEC=1
  name: memento-config

# 镜像 tag 由 .github/workflows/deploy.yml 在每次构建后用
# `kustomize edit set image` 回写为该 commit 的 sha,Fleet 监听到改动后部署。
# 初始 latest 仅占位;首跑后即被替换成不可变的 12 位 sha。
images:
- name: ghcr.io/ddong8/memento-server
  newName: ghcr.io/ddong8/memento-server
  newTag: ffcd4b547190
- name: ghcr.io/ddong8/memento-web
  newName: ghcr.io/ddong8/memento-web
  newTag: 2afb768f378e
