apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filmkit-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filmkit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filmkit
  template:
    metadata:
      labels:
        app: filmkit
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: filmkit
          image: ghcr.io/ddong8/filmkit:bb73d0815ba3
          imagePullPolicy: IfNotPresent
          env:
            - name: FILMKIT_ROOT
              value: /data/filmkit
            - name: HTTP_PROXY
              value: http://fleet-proxy.cattle-fleet-system.svc.cluster.local:10809
            - name: HTTPS_PROXY
              value: http://fleet-proxy.cattle-fleet-system.svc.cluster.local:10809
            - name: NO_PROXY
              value: localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,192.168.0.0/16,172.16.0.0/12,.svc,.cluster.local
            - name: http_proxy
              value: http://fleet-proxy.cattle-fleet-system.svc.cluster.local:10809
            - name: https_proxy
              value: http://fleet-proxy.cattle-fleet-system.svc.cluster.local:10809
            - name: no_proxy
              value: localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,192.168.0.0/16,172.16.0.0/12,.svc,.cluster.local
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memento-studio
                  key: gemini_api_key
                  optional: true
            - name: FILMKIT_WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memento-studio
                  key: filmkit_token
                  optional: true
          ports:
            - containerPort: 8765
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: filmkit-data
              mountPath: /data/filmkit
      volumes:
        - name: filmkit-data
          persistentVolumeClaim:
            claimName: filmkit-data
---
apiVersion: v1
kind: Service
metadata:
  name: filmkit
spec:
  selector:
    app: filmkit
  ports:
    - port: 8765
      targetPort: 8765
