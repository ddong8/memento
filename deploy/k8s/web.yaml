apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/ddong8/memento-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # 启动不到 1 秒就绪;容忍时间不变(连续失败 30 秒才摘流量)
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          lifecycle:
            # 同 api:先等网关摘掉再停,滚动更新时不出 502
            preStop:
              sleep: { seconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - port: 3000
      targetPort: 3000
